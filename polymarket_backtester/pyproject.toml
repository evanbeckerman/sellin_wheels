[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-btc-backtester"
version = "0.1.0"
description = "Provenance-first collection of Polymarket Bitcoin 15-minute market history"
requires-python = ">=3.11"
dependencies = ["httpx", "pandas", "numpy", "scipy", "streamlit", "plotly"]

[project.scripts]
pm-btc = "pm_btc.cli:main"

[tool.setuptools.packages.find]
include = ["pm_btc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
